name: Sync upstream into klno

# Wei-Shaw 更新先在本地 rebase klno、测试及检查身份漂移，然后创建审查 PR。
# 不再自动打产品标签，也不再重建 main；发布由统一 Release 流程处理。

on:
  schedule:
    - cron: '17 3 * * *' # UTC，每天一次
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '指定上游标签（留空=最新 vX.Y.Z）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-wei-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Wei-Shaw/sub2api
  FORK_BRANCH: klno
  CODEX_PINNED_COMMIT: e763730
  CODEX_IDENTITY_PATHS: >-
    codex-rs/codex-api/src/requests/headers.rs
    codex-rs/codex-api/src/endpoint/responses.rs
    codex-rs/core/src/responses_metadata.rs
    codex-rs/core/src/client.rs
    codex-rs/core/src/session/session.rs
    codex-rs/core/src/state/auto_compact_window.rs

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.up.outputs.latest }}
      changed: ${{ steps.bundle.outputs.changed }}
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v6
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve upstream tag
        id: up
        env:
          UPSTREAM_TAG_INPUT: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --tags --force upstream
          if [ -n "$UPSTREAM_TAG_INPUT" ]; then
            if [[ ! "$UPSTREAM_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::unexpected upstream tag: $UPSTREAM_TAG_INPUT"
              exit 1
            fi
            latest="$UPSTREAM_TAG_INPUT"
          else
            latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          fi
          if ! git ls-remote --exit-code --tags upstream "refs/tags/$latest" >/dev/null 2>&1; then
            echo "::error::upstream tag does not exist: $latest"
            exit 1
          fi
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${FORK_BRANCH}" | sed -E 's/-(klno|hao)\.[0-9]+$//')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "upstream latest=$latest, klno base=$base"

      - name: Rebase klno onto upstream tag
        id: rebase
        if: steps.up.outputs.latest != steps.up.outputs.base
        env:
          LATEST_TAG: ${{ steps.up.outputs.latest }}
          BASE_TAG: ${{ steps.up.outputs.base }}
        run: |
          set -euo pipefail
          git config user.name "klno-sync-bot"
          git config user.email "klno-sync-bot@users.noreply.github.com"
          if git rebase --onto "$LATEST_TAG" "$BASE_TAG" "$FORK_BRANCH"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git rebase --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on conflict
        if: steps.rebase.outputs.conflict == 'true'
        env:
          LATEST_TAG: ${{ steps.up.outputs.latest }}
          BASE_TAG: ${{ steps.up.outputs.base }}
        run: |
          echo "::error title=sync-upstream conflict::rebase klno ($BASE_TAG) onto $LATEST_TAG 冲突，需要人工处理，冲突文件见本步骤日志"
          cat /tmp/conflicts.txt
          exit 1

      - name: Setup Go
        if: steps.up.outputs.latest != steps.up.outputs.base
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build and targeted tests
        if: steps.up.outputs.latest != steps.up.outputs.base
        working-directory: backend
        run: |
          set -euo pipefail
          go build ./...
          set +e
          go test ./internal/service -count=1 -run 'CodexFingerprintConvergence|CodexAccountIdentity|CodexFingerprint|OAuthPassthrough|BuildOpenAIWSHeaders|SetupTokenCompat|IngressSession' 2>&1 | grep -vE '"level":"(DEBUG|INFO|WARN)"' | tail -20
          test_status=${PIPESTATUS[0]}
          set -e
          exit "$test_status"

      - name: Check codex-rs identity sources for drift
        run: |
          set -euo pipefail
          git clone -q --filter=blob:none https://github.com/openai/codex.git /tmp/codex
          cd /tmp/codex
          head=$(git rev-parse --short HEAD)
          changed=$(git diff --stat "${CODEX_PINNED_COMMIT}" HEAD -- ${CODEX_IDENTITY_PATHS} | tail -1 || true)
          if [ -n "$changed" ]; then
            git diff --stat "${CODEX_PINNED_COMMIT}" HEAD -- ${CODEX_IDENTITY_PATHS}
            echo "::error title=codex-rs identity drift::被跟踪的 codex-rs 身份文件相对 ${CODEX_PINNED_COMMIT} 有变动（当前 ${head}），请核对 openai_codex_fingerprint_convergence.go 的恒等式，确认后更新 CODEX_PINNED_COMMIT。"
            exit 1
          fi
          echo "codex identity sources unchanged since ${CODEX_PINNED_COMMIT}"

      - name: Export the tested branch without write credentials
        if: steps.up.outputs.latest != steps.up.outputs.base
        id: bundle
        run: |
          git bundle create "$RUNNER_TEMP/upstream.bundle" HEAD
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.bundle.outputs.changed == 'true'
        with:
          name: upstream-branch
          path: ${{ runner.temp }}/upstream.bundle
          retention-days: 1

  propose:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: upstream-branch
          path: ${{ runner.temp }}
      - name: Push reviewed update branch and create PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          LATEST_TAG: ${{ needs.sync.outputs.latest }}
        run: |
          set -euo pipefail
          [[ "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh auth setup-git
          git fetch "$RUNNER_TEMP/upstream.bundle" HEAD
          branch="sync/wei-release/$LATEST_TAG"
          # main is the product branch; never reset it to upstream or force-push it.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Update branch already exists: $branch"
          else
            git push origin "FETCH_HEAD:refs/heads/$branch"
          fi
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "ci(上游同步): 同步 Wei-Shaw $LATEST_TAG" \
              --body "同步上游正式标签 $LATEST_TAG；定向测试与身份漂移检查已通过。合并由维护者审查，候选构建及正式发布交由 Release 自动化。"
          fi
