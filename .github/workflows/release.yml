name: Release

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main]
  workflow_run:
    workflows: [CI, Security Scan]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Each run scans durable state. Coalescing a pending event loses no PR.
concurrency:
  group: release-reconcile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'haohex/sub2api'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: read
    outputs:
      work: ${{ steps.plan.outputs.work }}
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      simple: ${{ steps.plan.outputs.simple }}
      bundle_run: ${{ steps.plan.outputs.bundle_run }}
      trusted_sha: ${{ steps.trust.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Pin the trusted controller and activation boundary
        id: trust
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          since=$(git log --diff-filter=A --format=%cI -- tools/release/reconcile.py | tail -1)
          test -n "$since"
          echo "AUTOMATION_SINCE=$since" >> "$GITHUB_ENV"
      - name: Allocate or resume one candidate
        id: plan
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG_TOKEN: ${{ github.token }}
          TRUSTED_SHA: ${{ steps.trust.outputs.sha }}
          SIMPLE_RELEASE: ${{ vars.SIMPLE_RELEASE || 'false' }}
        run: python3 tools/release/reconcile.py plan

  ci:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/backend-ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}

  security:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/security-scan.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}

  build:
    needs: [plan, ci, security]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.trusted_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: source/backend/go.mod
          cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build binaries and OCI image without publishing credentials
        working-directory: source
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          SIMPLE_RELEASE: ${{ needs.plan.outputs.simple }}
          BUNDLE_DIR: ${{ runner.temp }}/bundle
        run: python3 ../control/tools/release/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.plan.outputs.tag }}
          path: ${{ runner.temp }}/bundle/
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [plan, build]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.work == 'true' &&
      (needs.build.result == 'success' || needs.plan.outputs.build == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.trusted_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.plan.outputs.tag }}
          path: ${{ runner.temp }}/bundle
          run-id: ${{ needs.plan.outputs.bundle_run || github.run_id }}
          github-token: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Authenticate registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish the frozen bundle as a prerelease
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          BUNDLE_DIR: ${{ runner.temp }}/bundle
        run: python3 tools/release/reconcile.py publish

  promote:
    needs: [plan, publish]
    if: always() && !cancelled() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.trusted_sha }}
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Authenticate registries
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            printf '%s' "$DOCKERHUB_TOKEN" | skopeo login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          fi
      - name: Reconcile merged releases, stable channels and VERSION
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 tools/release/reconcile.py promote
